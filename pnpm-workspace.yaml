allowBuilds:
  '@prisma/engines': true
  bcrypt: true
  core-js: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - framer-motion@13.3.0 || 13.5.0
  - lucide-react@1.46.0
  - moment@2.31.0
  - motion-dom@13.3.0 || 13.5.0
  - motion-utils@13.3.0 || 13.5.0
  - '@types/node@26.6.4'
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - bcrypt
  - esbuild
  - prisma
  - puppeteer
  - sharp
  - unrs-resolver
